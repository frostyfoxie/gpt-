name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile is currently stale relative to package.json. Use npm install
      # temporarily so CI can reach the actual test/build failures. The lockfile
      # will be regenerated as part of the dependency-baseline repair.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
